<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluebird – terminal policyjny</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center;padding:12px}
.wrap{width:100%;max-width:520px;overflow:hidden}
.dev{position:relative;width:112%;margin-left:-6%;container-type:inline-size;line-height:0}
.dev>img{width:100%;display:block}
.scr{position:absolute;left:33.6%;top:17.1%;width:40.1%;height:65.9%;background:#fff;overflow:hidden;line-height:1.3;font-size:2.6cqw}
#lock{position:absolute;inset:0;background:linear-gradient(#4aa3e0,#2d7fc4);color:#fff;text-align:center;touch-action:none;cursor:grab;transition:transform .3s;z-index:5;user-select:none}
#lock.drag{transition:none}
#clock{font-size:9cqw;font-weight:300;margin-top:16cqw;line-height:1.1}
#date{font-size:2.4cqw;margin-top:1cqw}
.hint{position:absolute;bottom:2.5cqw;left:0;right:0;font-size:2.3cqw}
.bar{position:absolute;bottom:7cqw;left:50%;width:10cqw;height:.8cqw;background:#fff;border-radius:1cqw;transform:translateX(-50%)}
.home{position:absolute;inset:0;background:#fff;padding:3cqw 2.5cqw}
.home h2{margin:0 0 2.5cqw;font-size:3cqw;color:#222}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.b{background:#1e7fe0;color:#fff;border:0;border-radius:1.8cqw;padding:4.5cqw 1cqw;font:inherit;font-size:2.5cqw;cursor:pointer}
.b:active{background:#1565b8}
.app{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:3}
.app.on{display:flex}
.top{background:#1e7fe0;color:#fff;padding:2cqw;display:flex;align-items:center;gap:1.5cqw;font-size:2.8cqw}
.top button{background:none;border:0;color:#fff;font-size:4cqw;cursor:pointer;padding:0 1cqw;line-height:1}
.body{padding:2.5cqw;overflow:auto;flex:1;color:#222}
label{display:block;font-size:2.2cqw;color:#555;margin:2cqw 0 .6cqw}
input,textarea{width:100%;padding:1.6cqw;border:1px solid #9aa7b5;border-radius:1.2cqw;font:inherit;font-size:2.5cqw;background:#fff;color:#111}
.save{margin-top:3cqw;width:100%;padding:3cqw}
.ok{margin-top:2cqw;color:#1a7f37;font-size:2.3cqw;min-height:1.2em}
select{width:100%;padding:1.6cqw;border:1px solid #9aa7b5;border-radius:1.2cqw;font:inherit;font-size:2.5cqw;background:#fff;color:#111}
.rec{border:1px solid #c9d3de;border-radius:1.2cqw;padding:1.6cqw;margin-bottom:2cqw;font-size:2.3cqw;line-height:1.35}
.rec b{display:block;margin-bottom:.8cqw}
.db{margin-top:2cqw;padding:1.6cqw;border-radius:1.2cqw;background:#eef5ff;border:1px solid #9cc3f0;font-size:2.2cqw;line-height:1.35;color:#222}
.db.warn{background:#fff1f0;border-color:#e6a19b}
.db div{margin-top:.6cqw}
</style>
</head>

<div class="scr">
  <div class="home">
    <h2>Terminal</h2>
    <div class="btns" id="btns"></div>
  </div>
  <div class="app" id="app">
    <div class="top"><button id="back" aria-label="Wróć">‹</button><span id="title"></span></div>
    <div class="body" id="form"></div>
  </div>
  <div id="lock" tabindex="0" role="button" aria-label="Przeciągnij w górę, aby odblokować">
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div class="bar"></div>
    <div class="hint">Przeciągnij w górę</div>
  </div>
</div>
</div>
</div>
<script>
const APPS={
"Legitymowanie":[["Imię"],["Nazwisko"],["Adres zamieszkania"],["Data urodzenia"]],
"Sprawdź pojazd":[["Numer rejestracyjny"],["Numer VIN"]],
"Mandat":[["Imię i nazwisko"],["Wykroczenie"],["Podstawa prawna"],["Kwota (zł)","number"],["Punkty karne","number"],["Płatność","select",["Gotówka","Kartą"]]],
"Notatki służbowe":[["Miejsce zdarzenia"],["Opis","area"]]
};
const NAMEIDX={"Legitymowanie":[0,1],"Mandat":[0]};
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let DB={people:{},entries:[]};
try{const s=localStorage.getItem('bluebird');if(s)DB=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem('bluebird',JSON.stringify(DB))}catch(e){}}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ');
const fmt=iso=>new Date(iso).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function tick(){const d=new Date();
$('clock').textContent=d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
$('date').textContent=d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});}
tick();setInterval(tick,1000);
const L=$('lock');let y0=null,dy=0;
L.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;L.classList.add('drag');L.setPointerCapture(e.pointerId)});
L.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.min(0,e.clientY-y0);L.style.transform='translateY('+dy+'px)'});
function end(){if(y0===null)return;y0=null;L.classList.remove('drag');
L.style.transform=dy<-40?'translateY(-105%)':''}
L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);
L.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='Enter'){L.style.transform='translateY(-105%)'}});
Object.keys(APPS).concat('Wpisane').forEach(n=>{const b=el('button','b',n);if(n==='Wpisane')b.style.gridColumn='span 2';b.onclick=()=>n==='Wpisane'?list():open(n);$('btns').appendChild(b)});
function show(title){$('title').textContent=title;$('form').innerHTML='';$('app').classList.add('on');return $('form')}
function keyOf(n,vals){const ix=NAMEIDX[n];if(!ix)return '';return norm(ix.map(i=>vals[i]||'').join(' '))}
function dbBox(n,box){const vals=APPS[n].map((_,i)=>$('f'+i).value);const k=keyOf(n,vals);
box.innerHTML='';box.className='db';
if(k.indexOf(' ')<1||k.length<5){box.style.display='none';return}
box.style.display='block';const p=DB.people[k];
if(!p){box.append(el('b','','Brak w bazie'));return}
const pts=p.offenses.reduce((s,o)=>s+(+o.points||0),0);
if(pts>0)box.classList.add('warn');
box.append(el('b','','W bazie: '+p.name));
if(p.address)box.append(el('div','','Adres: '+p.address));
if(p.born)box.append(el('div','','Data urodzenia: '+p.born));
box.append(el('div','','Punkty karne łącznie: '+pts));
if(!p.offenses.length)box.append(el('div','','Brak wykroczeń'));
p.offenses.forEach(o=>box.append(el('div','','• '+o.what+(o.basis?' ('+o.basis+')':'')+', '+o.points+' pkt, '+o.amount+' zł, '+o.pay+', '+fmt(o.t))));}
function open(n){const f=show(n);const box=el('div','db');box.style.display='none';
APPS[n].forEach(([t,type,opts],i)=>{f.append(Object.assign(el('label','',t),{htmlFor:'f'+i}));
let inp;if(type==='select'){inp=el('select');opts.forEach(o=>inp.append(el('option','',o)))}
else if(type==='area'){inp=el('textarea');inp.rows=3}
else{inp=el('input');if(type==='number'){inp.type='number';inp.min=0;inp.inputMode='numeric'}}
inp.id='f'+i;f.append(inp);
if(NAMEIDX[n]&&NAMEIDX[n].includes(i)){inp.addEventListener('input',()=>dbBox(n,box))}
if(NAMEIDX[n]&&i===NAMEIDX[n][NAMEIDX[n].length-1])f.append(box)});
const s=el('button','b save','Wypisz');s.onclick=()=>submit(n);f.append(s)}
function submit(n){const vals=APPS[n].map((_,i)=>$('f'+i).value.trim());const k=keyOf(n,vals);
const rows=APPS[n].map(([t],i)=>[t,vals[i]||'—']);
if(k){const nm=NAMEIDX[n].map(i=>vals[i]).join(' ').trim();const p=DB.people[k]||(DB.people[k]={name:nm,offenses:[]});
if(n==='Legitymowanie'){if(vals[2])p.address=vals[2];if(vals[3])p.born=vals[3]}
if(n==='Mandat')p.offenses.push({what:vals[1]||'—',basis:vals[2],amount:vals[3]||0,points:vals[4]||0,pay:vals[5],t:new Date().toISOString()})}
DB.entries.push({app:n,t:new Date().toISOString(),rows});save();
const f=show(n);f.append(el('div','ok','Wypisane'));
rows.forEach(([t,v])=>{f.append(el('label','',t),el('div','',v))});
if(n==='Mandat'&&k){const pts=DB.people[k].offenses.reduce((s,o)=>s+(+o.points||0),0);f.append(el('div','db warn','Punkty karne łącznie w bazie: '+pts))}
const nb=el('button','b save','Nowy wpis');nb.onclick=()=>open(n);f.append(nb)}
function list(){const f=show('Wpisane');
if(!DB.entries.length){f.append(el('div','','Brak wpisów.'));return}
DB.entries.slice(-30).reverse().forEach(e=>{const r=el('div','rec');r.append(el('b','',e.app+' • '+fmt(e.t)));
e.rows.forEach(([t,v])=>r.append(el('div','',t+': '+v)));f.append(r)})}
$('back').onclick=()=>$('app').classList.remove('on');
</script>
